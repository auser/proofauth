name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --doc
      - run: cargo build --all-targets --all-features
      - run: cargo run --example creator
      - run: cargo run --example registry_creator
      - run: cargo run --example consumer
      - run: >-
          cargo run -- bundle-verify
          @target/proofauth-demo/offline-bundle.hex
          @target/proofauth-demo/registry.json
          --root-public ed4928c628d1c2c6eae90338905995612959273a5c63f93636c14614ac8737d1
          --now 1050
